<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火柴人格斗场</title><style>*{box-sizing:border-box}body{margin:0;background:#080d1b;color:#e9efff;font:16px system-ui}main{max-width:1100px;margin:auto;padding:32px 20px}h1{margin:0;font-size:30px}p{color:#91a3c6}header{display:flex;justify-content:space-between;align-items:center}.tag{color:#69e4dc;font-size:12px;letter-spacing:3px}.controls{display:flex;gap:16px;flex-wrap:wrap;background:#141e33;padding:18px;border-radius:16px;margin:24px 0}label{flex:1;min-width:180px;font-size:12px;color:#9eafcc}input{display:block;width:100%;background:#080f20;color:white;border:1px solid #33445f;border-radius:8px;padding:11px;margin-top:7px;font:inherit}button,select{background:#253956;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer}button{background:#61e3d6;color:#08252c;font-weight:bold}svg{width:100%;display:block;background:radial-gradient(ellipse at 50% 75%,#203552,#0b1225 70%);border:1px solid #273954;border-radius:20px}.footer{display:flex;justify-content:space-between;margin-top:16px;color:#9eafcc;font-size:13px}.name{font:bold 18px system-ui;paint-order:stroke;stroke:#0a1224;stroke-width:5px}.limb{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.fx{fill:none;stroke:#ffe9a0;stroke-width:4;stroke-linecap:round} @media(prefers-reduced-motion:reduce){svg{opacity:.95}}</style><main><header><div><div class="tag">SVG · DUEL ARENA</div><h1>火柴人格斗场</h1></div><span id="round">回合 01</span></header><p>直拳、格挡、侧踢、扫腿、腾空踢与反击，自动轮换。输入名字，立即上场。</p><div class="controls"><label>青方姓名<input id="n1" value="疾风" maxlength="16"></label><label>红方姓名<input id="n2" value="赤影" maxlength="16"></label><label>动画速度<select id="speed"><option value="0.65">慢速 · 看清招式</option><option value="1" selected>正常速度</option><option value="1.5">快速对决</option></select></label><button id="pause">暂停动画</button><button id="reset">重新开打</button></div><svg viewBox="0 0 1000 540" role="img" aria-label="两个可改名的火柴人进行循环格斗动画"><defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#233049" stroke-width="1"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><path fill="url(#grid)" opacity=".4" d="M0 280H1000V540H0Z"/><ellipse cx="500" cy="435" rx="365" ry="49" fill="#223752" opacity=".45"/><path d="M70 435H930" stroke="#4b6b89" stroke-width="2"/><text id="move" x="500" y="65" text-anchor="middle" fill="#f2dfab" font-size="23" font-family="system-ui"/><text x="500" y="94" text-anchor="middle" fill="#7086a6" font-size="12">连续招式演示 · 友好切磋</text><g id="a"></g><g id="b"></g><g id="effects"></g></svg><div class="footer"><span id="caption">准备开始</span><span>姓名仅保存在当前页面 · 无需联网</span></div></main><script>
const $=id=>document.getElementById(id);let t=0,last=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;const moves=['试探直拳 · 抬臂格挡','左右连拳 · 后撤闪避','高位侧踢 · 双臂防守','俯身扫腿 · 轻跃躲避','腾空飞踢 · 侧身避让','近身反击 · 交叉格挡'];function pose(k,p,def){let s=Math.sin(p*Math.PI),q=Math.sin(p*Math.PI*2);let v={head:[0,-146],body:[0,-110,0,-57],arms:[-29,-76,-43,-48,29,-80,43,-105],legs:[-23,-23,-34,0,24,-25,37,0]};if(def){v.arms=[-22,-110,-37,-143,25,-112,36,-146];v.head=[s*9,-146];return v}if(k<2)v.arms=[-26,-108,-40,-128,35+35*s,-111,48+80*s,-122+q*8];if(k===2)v.legs=[-15,-25,-22,0,40,-68,115*s+25,-110*s];if(k===3){v.head=[25,-105];v.body=[20,-75,0,-40];v.legs=[-25,-15,-42,0,45,-18,120*s+20,-8];}if(k===4){v.legs=[-20,-40,-55,-26,50,-55,105,-65];v.arms=[-35,-95,-60,-120,35,-95,50,-135]}if(k===5)v.arms=[-25,-105,-40,-130,40,-100,55+65*s,-135];return v}function fighter(id,name,color,x,y,dir,k,p,def){let v=pose(k,p,def),a=v.arms,l=v.legs;$(id).innerHTML=`<ellipse cx="${x}" cy="435" rx="48" ry="8" fill="${color}" opacity=".12"/><text class="name" x="${x}" y="${y-192}" fill="${color}" text-anchor="middle"></text><g transform="translate(${x} ${y}) scale(${dir} 1)" stroke="${color}" class="limb"><circle cx="${v.head[0]}" cy="${v.head[1]}" r="21"/><path d="M${v.body[0]} ${v.body[1]}L${v.body[2]} ${v.body[3]}M0 -105L${a[0]} ${a[1]}L${a[2]} ${a[3]}M0 -105L${a[4]} ${a[5]}L${a[6]} ${a[7]}M0 -57L${l[0]} ${l[1]}L${l[2]} ${l[3]}M0 -57L${l[4]} ${l[5]}L${l[6]} ${l[7]}"/></g>`;$(id).querySelector('text').textContent=name||'无名侠'}function draw(){let cycle=t/2.2,k=Math.floor(cycle)%6,p=cycle%1,s=Math.sin(p*Math.PI),swap=k===5;let x1=370+s*35,x2=620+s*12,y1=430-(k===4?s*95:Math.sin(p*Math.PI*2)*3),y2=430-(k===3?s*62:0);fighter('a',$('n1').value,'#63e4dc',x1,y1,1,k,p,swap);fighter('b',$('n2').value,'#ff7f96',x2,y2,-1,k,p,!swap);$('move').textContent=moves[k];$('round').textContent='回合 '+String(Math.floor(cycle/6)+1).padStart(2,'0');$('caption').textContent= p>.38&&p<.7?'招式交锋 · 格挡与闪避':'调整步伐 · 寻找时机';let fx='';if(p>.38&&p<.7){let cx=swap?430:550,cy=k===3?412:k===2?320:300;for(let i=0;i<8;i++){let a=i*Math.PI/4;fx+=`<path class="fx" opacity="${Math.sin((p-.38)/.32*Math.PI)}" d="M${cx+Math.cos(a)*14} ${cy+Math.sin(a)*14}l${Math.cos(a)*19} ${Math.sin(a)*19}"/>`}fx+=`<path d="M450 350Q530 220 585 290" fill="none" stroke="#ffffff" stroke-width="3" opacity=".18"/>`}$('effects').innerHTML=fx}function frame(now){if(last&&playing)t+=Math.min((now-last)/1000,.05)*Number($('speed').value);last=now;draw();requestAnimationFrame(frame)}function label(){$('pause').textContent=playing?'暂停动画':'继续动画'}$('pause').onclick=()=>{playing=!playing;label()};$('reset').onclick=()=>{t=0;draw()};label();requestAnimationFrame(frame);
</script></html>
